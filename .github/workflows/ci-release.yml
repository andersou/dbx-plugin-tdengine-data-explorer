name: CI and release

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ci-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  NODE_VERSION: 24.20.0
  TDENGINE_IMAGE: tdengine/tdengine:3.3.6.13

jobs:
  # Test and build the UI once: the package job ships this exact ui/ in the .dbxp.
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Start TDengine for the SQL integration tests
        run: |
          docker run -d --name tdengine -p 6041:6041 "$TDENGINE_IMAGE"
          curl -sf --retry 30 --retry-delay 2 --retry-connrefused --retry-all-errors -u root:taosdata -d "SELECT server_version()" http://localhost:6041/rest/sql
          docker exec tdengine taosBenchmark -y -d power -t 10 -n 100
      - name: Test and build the UI
        env:
          TDENGINE_URL: http://localhost:6041
        run: |
          npm ci
          npm test
          npm run build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ui
          path: ui
          if-no-files-found: error
          retention-days: 7

  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.source.outputs.version }}
    steps:
      - id: source
        name: Read immutable source metadata
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          # non-release builds are stamped with a dev version
          echo "version=0.0.0-dev.${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  release-plan:
    if: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (github.ref_name == 'main' || github.ref_name == 'develop') }}
    needs: metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.plan.outputs.publish }}
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm
        run: npm install --global npm@11.9.0
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - id: plan
        name: Calculate release version
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:dry-run

  package:
    needs: [quality, metadata, release-plan]
    if: ${{ always() && needs.quality.result == 'success' && needs.metadata.result == 'success' && (needs.release-plan.result == 'success' || needs.release-plan.result == 'skipped') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ui
          path: ui
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install the DBX plugin CLI
        run: npm ci --ignore-scripts
      - name: Stamp the version and package the .dbxp
        shell: bash
        env:
          VERSION: ${{ needs.release-plan.outputs.publish == 'true' && needs.release-plan.outputs.version || needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          # manifest.json keeps 0.0.0-dev in git; the package carries the build version.
          node -e 'const fs = require("fs"); const m = JSON.parse(fs.readFileSync("manifest.json", "utf8")); m.version = process.env.VERSION; fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2) + "\n");'
          package="$(node -p 'require("./manifest.json").id')-${VERSION}-universal.dbxp"
          npx dbx-plugin package . --artifact-url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${package}"
          test "$(unzip -p "dist/$package" manifest.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')" = "$VERSION"
          (cd dist && sha256sum "$package" > SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dbxp
          path: |
            dist/*.dbxp
            dist/*.artifact.json
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

  release:
    if: ${{ needs.release-plan.outputs.publish == 'true' }}
    needs: [metadata, release-plan, package]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.metadata.outputs.sha }}
          fetch-depth: 0
          fetch-tags: true
      - name: Confirm branch head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote_head=$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | cut -f1)
          test "$remote_head" = "${{ needs.metadata.outputs.sha }}"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install npm
        run: npm install --global npm@11.9.0
      - name: Install release dependencies
        run: npm ci --ignore-scripts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dbxp
          path: dist
      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          packages=(dist/*.dbxp)
          test "${#packages[@]}" -eq 1
          metadata=(dist/*.artifact.json)
          test "${#metadata[@]}" -eq 1
          (cd dist && sha256sum -c SHA256SUMS)
      - name: Publish release
        env:
          EXPECTED_VERSION: ${{ needs.release-plan.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: npm run release
